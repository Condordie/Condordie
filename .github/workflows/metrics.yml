name: Metrics
on:
  # Se actualiza automáticamente cada día a la medianoche UTC
  schedule: [{cron: "0 0 * * *"}]
  # Permite ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token configurado en los Secrets
          token: ${{ secrets.METRICS_TOKEN }}

          # Reemplaza TU-USUARIO por tu nombre de usuario exacto de GitHub
          user: Condordie

          # Opciones de diseño y contenido
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Calendario de contribuciones estilo isométrica
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
