name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Columna izquierda: perfil, actividad, repos y hábitos de código
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.left.svg
          template: classic
          config_timezone: America/Santiago
          config_animations: yes
          base: header, activity, community, repositories, metadata
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member

          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # Columna derecha: PageSpeed, calendario 3D, lenguajes y logros
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.right.svg
          template: classic
          config_timezone: America/Santiago
          config_animations: yes
          base: ""

          plugin_pagespeed: yes
          plugin_pagespeed_url: https://auroradevs.cl
          plugin_pagespeed_detailed: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          plugin_achievements: yes
          plugin_achievements_threshold: C
