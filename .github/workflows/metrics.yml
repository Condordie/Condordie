name: Metrics
on:
  # Se actualiza automáticamente cada día a la medianoche UTC
  schedule: [{cron: "0 0 * * *"}]
  # Permite ejecución manual desde la pestaña Actions
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Condordie
          template: classic
          
          # Configuración básica del perfil
          base: header, activity, community, repositories, metadata
          
          # Hábito de programación y horarios (Commit activity)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Lenguajes más usados
          plugin_languages: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          # Isocalendario 3D (Isometric contribution calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Tecnologías dominadas e iconos (Topics/Icons)
          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons
          plugin_music: yes
          plugin_music_provider: spotify
